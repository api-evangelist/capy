aid: capy
name: Capy
description: >-
  Capy is an AI software-engineering platform that orchestrates a fleet of cloud
  coding agents inside the apps a team already uses (Slack, Linear, GitHub). Each
  task runs in its own isolated Ubuntu VM where a captain agent plans and build
  agents execute — writing code, running end-to-end browser tests, migrating
  codebases, generating docs, triaging and fixing bugs, and opening pull requests
  for review. Capy supports multiple frontier models (GPT, Claude, Grok, Gemini)
  and exposes a REST API (bearer capy_ token) plus scheduled and webhook-triggered
  automations. Backed by CRV; SOC 2 Type II certified.
