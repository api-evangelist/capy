openapi: 3.2.0
info:
  title: Capy Threads API
  version: 1.0.0
  description: Programmatic access to Capy's agent platform.
servers:
- url: https://api.capy.ai
security:
- bearerAuth: []
tags:
- name: Threads
paths:
  /api/v1/threads:
    get:
      tags:
      - Threads
      operationId: threads.list
      parameters:
      - name: projectId
        in: query
        schema:
          type: string
        required: true
      - name: limit
        in: query
        schema:
          type: integer
        required: false
      - name: cursor
        in: query
        schema:
          type: string
          pattern: ^\d{1,15}:.+
        required: false
      security:
      - bearerAuth: []
      responses:
        '200':
          description: ThreadPage
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ThreadPageEncoded'
        '401':
          description: capy/Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/capy_UnauthorizedEncoded'
        '403':
          description: capy/Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/capy_ForbiddenEncoded'
        '404':
          description: capy/ProjectNotFound
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/capy_ProjectNotFoundEncoded'
        '429':
          description: capy/RateLimited
          headers:
            retry-after:
              schema:
                type: integer
              required: true
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/capy_RateLimitedEncoded'
      summary: List threads
    post:
      tags:
      - Threads
      operationId: threads.create
      parameters: []
      security:
      - bearerAuth: []
      responses:
        '200':
          description: Thread
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ThreadEncoded'
        '400':
          description: capy/InvalidRequest | ModelSelection.Rejected
          content:
            application/json:
              schema:
                anyOf:
                - $ref: '#/components/schemas/capy_InvalidRequestEncoded'
                - $ref: '#/components/schemas/ModelSelection.RejectedEncoded'
        '401':
          description: capy/Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/capy_UnauthorizedEncoded'
        '402':
          description: capy/PaidFeatureUnavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/capy_PaidFeatureUnavailableEncoded'
        '403':
          description: capy/Forbidden
          content:
            application/json:
              schema:
                anyOf:
                - $ref: '#/components/schemas/capy_ForbiddenEncoded'
                - $ref: '#/components/schemas/capy_ForbiddenEncoded'
        '404':
          description: capy/ProjectNotFound
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/capy_ProjectNotFoundEncoded'
        '429':
          description: capy/RateLimited
          headers:
            retry-after:
              schema:
                type: integer
              required: true
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/capy_RateLimitedEncoded'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateThreadRequest'
        required: true
      summary: Create thread
  /api/v1/threads/{threadId}:
