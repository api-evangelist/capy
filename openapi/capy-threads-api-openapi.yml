components:
  schemas:
    ThreadCaptain:
      type: object
      properties:
        jamId:
          type: string
        name:
          type: string
        avatar:
          $ref: '#/components/schemas/CaptainAvatar'
      required:
      - jamId
      - name
      - avatar
      additionalProperties: false
    ModelSelection.RejectedEncoded:
      type: object
      properties:
        _tag:
          type: string
          enum:
          - ModelSelection.Rejected
        message:
          type: string
        candidates:
          type: array
          items:
            type: object
            properties:
              entryId:
                type: string
              name:
                type: string
              billingLabel:
                type: string
            required:
            - entryId
            - name
            - billingLabel
            additionalProperties: false
        rejection:
          type: string
          enum:
          - disconnected
          - not_connected
        modelId:
          type: string
        service:
          type: string
          enum:
          - codex
          - copilot
          - supergrok
          - claude
        health:
          type: object
          properties:
            state:
              type: string
              enum:
              - connected
              - not_connected
              - signed_out
              - disabled
              - usage_exhausted
            kind:
              type: string
              enum:
              - subscription
              - key
            provider:
              type: string
            action:
              type: string
              enum:
              - connect
              - reconnect
              - replace_key
              - enable
            resetsAt:
              type: string
          required:
          - state
          - kind
          - provider
          additionalProperties: false
      required:
      - _tag
      - message
      - candidates
      additionalProperties: false
    capy_ConflictEncoded:
      type: object
      properties:
        _tag:
          type: string
          enum:
          - capy/Conflict
        message:
          type: string
      required:
      - _tag
      - message
      additionalProperties: false
    ModelSelection:
      type: object
      properties:
        modelId:
          type: string
        reasoningMode:
          type: string
          enum:
          - none
          - instant
          - minimal
          - low
          - medium
          - high
          - xhigh
          - max
        modes:
          type: object
          properties:
            fast:
              type: boolean
            pro:
              type: boolean
            ultrafast:
              type: boolean
          additionalProperties: false
      required:
      - modelId
      additionalProperties: false
    UsageTotalsEncoded:
      type: object
      properties:
        llmCredits:
          anyOf:
          - type: number
          - type: string
            enum:
            - Infinity
            - -Infinity
            - NaN
        imageCredits:
          anyOf:
          - type: number
          - type: string
            enum:
            - Infinity
            - -Infinity
            - NaN
        vmCredits:
          anyOf:
          - type: number
          - type: string
            enum:
            - Infinity
            - -Infinity
            - NaN
        totalCredits:
          anyOf:
          - type: number
          - type: string
            enum:
            - Infinity
            - -Infinity
            - NaN
      required:
      - llmCredits
      - imageCredits
      - vmCredits
      - totalCredits
      additionalProperties: false
    RenameThreadRequest:
      type: object
      properties:
        title:
          anyOf:
          - type: string
          - type: 'null'
      required:
      - title
      additionalProperties: false
    ThreadLinearIssue:
      type: object
      properties:
        key:
          type: string
        url:
          anyOf:
          - type: string
          - type: 'null'
      required:
      - key
      - url
      additionalProperties: false
    EnvironmentVariableWrite:
      type: object
      properties:
        name:
          type: string
          pattern: ^[A-Za-z_][A-Za-z0-9_]*$
        value:
          type: string
        description:
          anyOf:
          - type: string
          - type: 'null'
      required:
      - name
      - value
      additionalProperties: false
    capy_ThreadNotFoundEncoded:
      type: object
      properties:
        _tag:
          type: string
          enum:
          - capy/ThreadNotFound
        threadId:
          type: string
      required:
      - _tag
      - threadId
      additionalProperties: false
    ThreadEncoded:
      type: object
      properties:
        id:
          type: string
        projectId:
          anyOf:
          - type: string
          - type: 'null'
        authorId:
          anyOf:
          - type: string
          - type: 'null'
        previousAuthorId:
          anyOf:
          - type: string
          - type: 'null'
        title:
          anyOf:
          - type: string
          - type: 'null'
        titleCustom:
          type: boolean
        status:
          type: string
          enum:
          - working
          - waiting
          - idle
          - failed
          - archived
        archived:
          type: boolean
        lastModelId:
          anyOf:
          - type: string
          - type: 'null'
        linearIssue:
          anyOf:
          - $ref: '#/components/schemas/ThreadLinearIssue'
          - type: 'null'
        pullRequestAuthor:
          anyOf:
