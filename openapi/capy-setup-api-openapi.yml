                - type: array
                  items:
                    type: string
                - type: object
                  properties:
                    commands:
                      type: array
                      items:
                        type: string
                      description: Shell commands to run
                    agents:
                      type: array
                      items:
                        type: string
                        enum:
                        - captain
                        - build
                        - review
                      description: 'Which agent types this applies to. Omit to apply to all agents (default: all)'
                  required:
