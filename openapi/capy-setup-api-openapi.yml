                        minimum: 60
                        maximum: 3600
                      updateAfterCheckout:
                        type: integer
                        minimum: 60
                        maximum: 3600
                      startup:
                        type: integer
                        minimum: 60
                        maximum: 3600
                    additionalProperties: false
                  commands:
                    type: array
                    items:
                      type: object
                      properties:
                        name:
                          type: string
                        command:
                          type: string
                      required:
                      - name
                      - command
                      additionalProperties: false
                required:
                - repository
                - branch
                - scripts
                - commands
                additionalProperties: false
            hooks:
              type: object
              properties:
                pre:
                  type: object
                  propertyNames:
                    type: string
                  additionalProperties:
                    anyOf:
                    - type: array
                      items:
                        type: string
                    - type: object
                      properties:
                        commands:
                          type: array
                          items:
                            type: string
                          description: Shell commands to run
                        agents:
                          type: array
                          items:
                            type: string
                            enum:
                            - captain
                            - build
                            - review
                          description: 'Which agent types this applies to. Omit to apply to all agents (default: all)'
                      required:
                      - commands
                      additionalProperties: false
                  description: Commands to run BEFORE a tool executes. Keys are tool names (bash_run, edit, write, etc.), values are arrays of shell commands or objects with commands and agents filter
                post:
                  type: object
                  propertyNames:
                    type: string
                  additionalProperties:
                    anyOf:
                    - type: array
                      items:
                        type: string
                    - type: object
                      properties:
                        commands:
                          type: array
                          items:
                            type: string
                          description: Shell commands to run
                        agents:
                          type: array
                          items:
                            type: string
                            enum:
                            - captain
