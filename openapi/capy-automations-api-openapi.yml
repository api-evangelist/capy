          description: Hard deadline from the first event, from 1 to 3600 seconds. Required; later arrivals never extend it.
        quiet_period_seconds:
          type: integer
          minimum: 1
          maximum: 3600
          description: Optional idle window after the last unique acceptance, from 1 to 3600 seconds and no greater than maximum wait. Omit to disable idle closing. Duplicates never reset it.
