          body_pointer:
            type: string
            maxLength: 1024
            pattern: ^(?:\/(?:[^~]|~[01])*)*$
            description: Strict RFC6901 JSON pointer into the parsed body, up to 1024 characters. Empty selects the root. The selected value must be a non-null finite scalar of at most 1024 UTF-8 bytes when JSON encoded.
