openapi: 3.2.0
info:
  title: Capy Automations API
  version: 1.0.0
  description: Programmatic access to Capy's agent platform.
servers:
- url: https://api.capy.ai
security:
- bearerAuth: []
tags:
- name: Automations
paths:
  /api/v1/automations/{automationId}/batches:
    get:
      tags:
      - Automations
      operationId: automations.listBatches
      parameters:
      - name: automationId
        in: path
        schema:
          type: string
        required: true
      - name: limit
        in: query
        schema:
          type: string
          pattern: ^[+-]?\d*\.?\d+(?:[Ee][+-]?\d+)?$
        required: false
      - name: cursor
        in: query
        schema:
          $ref: '#/components/schemas/WebhookBatchCursorEncoded'
        required: false
      - name: status
        in: query
        schema:
          $ref: '#/components/schemas/WebhookBatchStatus'
        required: false
      security:
      - bearerAuth: []
      responses:
        '200':
          description: AutomationWebhookBatchPage
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AutomationWebhookBatchPageEncoded'
        '401':
          description: capy/Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/capy_UnauthorizedEncoded'
        '403':
          description: capy/Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/capy_ForbiddenEncoded'
        '404':
          description: capy/AutomationNotFound
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/capy_AutomationNotFoundEncoded'
        '429':
          description: capy/RateLimited
          headers:
            retry-after:
              schema:
                type: integer
              required: true
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/capy_RateLimitedEncoded'
      summary: List batches
  /api/v1/automations/{automationId}/batches/{batchId}/flush:
    post:
      tags:
      - Automations
      operationId: automations.flushBatch
      parameters:
      - name: automationId
        in: path
        schema:
          type: string
        required: true
      - name: batchId
        in: path
        schema:
          type: string
        required: true
      security:
      - bearerAuth: []
      responses:
        '200':
          description: AutomationWebhookBatch
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AutomationWebhookBatchEncoded'
        '401':
          description: capy/Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/capy_UnauthorizedEncoded'
        '403':
          description: capy/Forbidden
          content:
            application/json:
              schema:
                anyOf:
                - $ref: '#/components/schemas/capy_ForbiddenEncoded'
                - $ref: '#/components/schemas/capy_ForbiddenEncoded'
        '404':
          description: capy/AutomationNotFound
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/capy_AutomationNotFoundEncoded'
        '429':
          description: capy/RateLimited
          headers:
            retry-after:
              schema:
                type: integer
              required: true
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/capy_RateLimitedEncoded'
      summary: Flush batch
  /api/v1/automations/{automationId}/batches/{batchId}/cancel:
    post:
      tags:
      - Automations
      operationId: automations.cancelBatch
      parameters:
      - name: automationId
        in: path
        schema:
          type: string
        required: true
      - name: batchId
        in: path
        schema:
          type: string
        required: true
      security:
      - bearerAuth: []
      responses:
        '200':
          description: AutomationWebhookBatch
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AutomationWebhookBatchEncoded'
        '401':
          description: capy/Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/capy_UnauthorizedEncoded'
        '403':
          description: capy/Forbidden
          content:
            application/json:
              schema:
                anyOf:
                - $ref: '#/components/schemas/capy_ForbiddenEncoded'
                - $ref: '#/components/schemas/capy_ForbiddenEncoded'
        '404':
          description: capy/AutomationNotFound
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/capy_AutomationNotFoundEncoded'
        '429':
          description: capy/RateLimited
          headers:
            retry-after:
              schema:
                type: integer
              required: true
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/capy_RateLimitedEncoded'
      summary: Cancel batch
  /api/v1/automations:
    get:
      tags:
      - Automations
      operationId: automations.list
      parameters:
      - name: projectId
        in: query
        schema:
          type: string
        required: false
      - name: limit
        in: query
        schema:
          type: integer
        required: false
      - name: cursor
        in: query
        schema:
          type: string
          pattern: ^\d{1,15}:.+
        required: false
      security:
      - bearerAuth: []
      responses:
        '200':
          description: AutomationPage
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AutomationPageEncoded'
        '401':
          description: capy/Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/capy_UnauthorizedEncoded'
        '403':
          description: capy/Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/capy_ForbiddenEncoded'
        '404':
          description: capy/ProjectNotFound
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/capy_ProjectNotFoundEncoded'
        '429':
          description: capy/RateLimited
          headers:
            retry-after:
              schema:
                type: integer
              required: true
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/capy_RateLimitedEncoded'
      summary: List automations
    post:
      tags:
      - Automations
      operationId: automations.create
      parameters: []
      security:
      - bearerAuth: []
      responses:
        '200':
          description: AutomationCreated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AutomationCreatedEncoded'
        '400':
          description: capy/InvalidRequest | ModelSelection.Rejected
          content:
            application/json:
              schema:
                anyOf:
                - $ref: '#/components/schemas/capy_InvalidRequestEncoded'
                - $ref: '#/components/schemas/ModelSelection.RejectedEncoded'
        '401':
          description: capy/Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/capy_UnauthorizedEncoded'
        '402':
          description: capy/PaidFeatureUnavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/capy_PaidFeatureUnavailableEncoded'
        '403':
          description: capy/Forbidden
          content:
            application/json:
              schema:
                anyOf:
                - $ref: '#/components/schemas/capy_ForbiddenEncoded'
                - $ref: '#/components/schemas/capy_ForbiddenEncoded'
        '404':
          description: capy/ProjectNotFound
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/capy_ProjectNotFoundEncoded'
        '429':
          description: capy/RateLimited
          headers:
            retry-after:
              schema:
                type: integer
              required: true
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/capy_RateLimitedEncoded'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateAutomationRequest'
        required: true
      summary: Create automation
  /api/v1/automations/{automationId}/enable:
    post:
      tags:
      - Automations
      operationId: automations.enable
      parameters:
      - name: automationId
        in: path
        schema:
          type: string
        required: true
      security:
      - bearerAuth: []
      responses:
        '200':
          description: Automation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AutomationEncoded'
        '400':
          description: capy/InvalidRequest
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/capy_InvalidRequestEncoded'
        '401':
          description: capy/Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/capy_UnauthorizedEncoded'
        '403':
          description: capy/Forbidden
          content:
            application/json:
              schema:
                anyOf:
                - $ref: '#/components/schemas/capy_ForbiddenEncoded'
                - $ref: '#/components/schemas/capy_ForbiddenEncoded'
        '404':
          description: capy/AutomationNotFound
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/capy_AutomationNotFoundEncoded'
        '429':
          description: capy/RateLimited
          headers:
            retry-after:
              schema:
                type: integer
              required: true
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/capy_RateLimitedEncoded'
      summary: Enable automation
  /api/v1/automations/{automationId}/disable:
    post:
      tags:
      - Automations
      operationId: automations.disable
      parameters:
      - name: automationId
        in: path
        schema:
          type: string
        required: true
      security:
      - bearerAuth: []
      responses:
        '200':
          description: Automation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AutomationEncoded'
        '401':
          description: capy/Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/capy_UnauthorizedEncoded'
        '403':
          description: capy/Forbidden
          content:
            application/json:
              schema:
                anyOf:
                - $ref: '#/components/schemas/capy_ForbiddenEncoded'
                - $ref: '#/components/schemas/capy_ForbiddenEncoded'
        '404':
          description: capy/AutomationNotFound
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/capy_AutomationNotFoundEncoded'
        '429':
          description: capy/RateLimited
          headers:
            retry-after:
              schema:
                type: integer
              required: true
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/capy_RateLimitedEncoded'
      summary: Disable automation
  /api/v1/automations/{automationId}/delete:
    post:
      tags:
      - Automations
      operationId: automations.delete
      parameters:
      - name: automationId
        in: path
        schema:
          type: string
        required: true
      security:
      - bearerAuth: []
      responses:
        '200':
          description: Automation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AutomationEncoded'
        '401':
          description: capy/Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/capy_UnauthorizedEncoded'
        '403':
          description: capy/Forbidden
          content:
            application/json:
              schema:
                anyOf:
                - $ref: '#/components/schemas/capy_ForbiddenEncoded'
                - $ref: '#/components/schemas/capy_ForbiddenEncoded'
        '404':
          description: capy/AutomationNotFound
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/capy_AutomationNotFoundEncoded'
        '429':
          description: capy/RateLimited
          headers:
            retry-after:
              schema:
                type: integer
              required: true
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/capy_RateLimitedEncoded'
      summary: Delete automation
  /api/v1/automations/{automationId}/restore:
    post:
      tags:
      - Automations
      operationId: automations.restore
      parameters:
      - name: automationId
        in: path
        schema:
          type: string
        required: true
      security:
      - bearerAuth: []
      responses:
        '200':
          description: Automation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AutomationEncoded'
        '400':
          description: capy/InvalidRequest
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/capy_InvalidRequestEncoded'
        '401':
          description: capy/Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/capy_UnauthorizedEncoded'
        '403':
          description: capy/Forbidden
          content:
            application/json:
              schema:
                anyOf:
                - $ref: '#/components/schemas/capy_ForbiddenEncoded'
                - $ref: '#/components/schemas/capy_ForbiddenEncoded'
        '404':
          description: capy/AutomationNotFound
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/capy_AutomationNotFoundEncoded'
        '429':
          description: capy/RateLimited
          headers:
            retry-after:
              schema:
                type: integer
              required: true
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/capy_RateLimitedEncoded'
      summary: Restore automation
components:
  schemas:
    AutomationEncoded:
      type: object
      properties:
        id:
          type: string
        projectId:
          type: string
        name:
          type: string
        description:
          anyOf:
          - type: string
          - type: 'null'
        prompt:
          type: string
        triggers:
          type: array
          items:
            anyOf:
            - type: object
              properties:
                type:
                  type: string
                  enum:
                  - schedule
                cron:
                  type: string
                  minLength: 1
                  description: Five-field cron expression, e.g. `0 9 * * *` for daily at 09:00.
                timezone:
                  type: string
                  minLength: 1
                  description: IANA timezone for the schedule, e.g. `America/New_York`.
              required:
              - type
              - cron
              - timezone
              additionalProperties: false
            - type: object
              properties:
                type:
                  type: string
                  enum:
                  - github
                event:
                  type: string
                  enum:
                  - draft_opened
                  - pull_request_opened
                  - pull_request_pushed
                  - pull_request_merged
                  - comment
                  - branch_push
                  - label_change
                  - checks
                  - issue_comment
                  - pull_request_review_comment
                  - pull_request_review_submitted
                  - pull_request_review_thread
                  - workflow_run
                  description: The GitHub event that starts a run.
                conditions:
                  type: object
                  properties:
                    repositories:
                      type: array
                      items:
                        type: string
                      description: Full repository names to match, e.g. owner/repo.
                    branches:
                      type: array
                      items:
                        type: string
                      description: 'Branch names to match: a pull request''s base branch, or the branch of a push, check, or workflow run.'
                    head_branches:
                      type: array
                      items:
                        type: string
                      description: 'Head branch names to match: a pull request''s head branch, or the branch a check or workflow run ran on.'
                    authors:
                      type: array
                      items:
                        type: string
                      description: GitHub login names of the author of the pull request or issue the event is on, not the commenter or reviewer (use actors for those).
                    labels:
                      type: array
                      items:
                        type: string
                      description: Match when any of these labels is present; on label_change, the label that was added or removed.
                    states:
                      type: array
                      items:
                        type: string
                        enum:
                        - open
                        - draft
                        - closed
                        - merged
                      description: Pull request states to match.
                    actions:
                      type: array
                      items:
                        type: string
                      description: Raw event action names to match, e.g. opened, closed.
                    conclusions:
                      type: array
                      items:
                        type: string
                      description: Check or workflow conclusions to match, e.g. success, failure.
                    workflows:
                      type: array
                      items:
                        type: string
                      description: Workflow display names to match (the yml `name`), not file names.
                    check_names:
                      type: array
                      items:
                        type: string
                      description: Check run names to match.
                    review_states:
                      type: array
                      items:
                        type: string
                      description: Review states to match, e.g. approved, changes_requested.
                    actors:
                      type: array
                      items:
                        type: string
                      description: 'GitHub login names of the actor that fired the event: the pusher, commenter, reviewer, or merger.'
                  additionalProperties: false
                  description: Filters that narrow which GitHub events start a run. A condition matches when the event matches any of its listed values.
                run_when:
                  type: string
                  minLength: 1
                  description: Natural-language gate checked against each event before a run starts; non-matching events are skipped, so keep it to one sentence. To remove the gate, omit this field from the trigger; null is rejected.
              required:
              - type
              - event
              additionalProperties: false
            - type: object
              properties:
                type:
                  type: string
                  enum:
                  - slack
                event:
                  type: string
                  enum:
                  - message
                  - reaction
                  - channel_created
                  description: The Slack event that starts a run.
                conditions:
                  type: object
                  properties:
                    workspaces:
                      type: array
                      items:
                        type: string
                      description: Slack team ids (T...) to match. Not workspace names. A subscription fills in the organization's connected workspace when omitted.
                    channels:
                      type: array
                      items:
                        type: string
                      description: 'Slack channel ids (C...) to match. Not #channel-names.'
                    threads:
                      type: array
                      items:
                        type: string
                      description: 'Parent message timestamps to match: only replies in those threads, never a top-level message.'
                    users:
                      type: array
                      items:
                        type: string
                      description: 'Slack user ids (U...) to match: the message author on a message trigger, the person who added the reaction on a reaction trigger.'
                    actors:
                      type: array
                      items:
                        type: string
                      description: Slack user ids (U...) of the actor that fired the event.
                    reactions:
                      type: array
                      items:
                        type: string
                      description: Emoji names without colons to match on a reaction trigger, e.g. eyes or firecracker; a custom workspace emoji is its name.
                    message_placements:
                      type: array
                      items:
                        type: string
                        enum:
                        - top_level
                        - reply
                      description: Match top-level messages, replies, or both.
                    message_types:
                      type: array
                      items:
                        type: string
                        enum:
                        - human
                        - bot
                      description: Match human messages, bot messages, or both.
                    include_bots:
                      type: boolean
                      description: Include messages from bots. Defaults to false.
                    grouping_window_seconds:
                      type: integer
                      minimum: 0
                      maximum: 300
                      description: Seconds to group a burst of messages into one run. Defaults to 0 - no grouping, one run per matched message immediately.
                    contains:
                      type: array
                      items:
                        type: string
                      description: Run only when the message text contains one of these substrings.
                    excludes:
                      type: array
                      items:
                        type: string
                      description: Skip when the message text contains one of these substrings.
                    regex:
                      type: string
                      description: Run only when the message text matches this regular expression.
                  additionalProperties: false
                  description: Filters that narrow which Slack events start a run. A condition matches when the event matches any of its listed values.
                run_when:
                  type: string
                  minLength: 1
                  description: Natural-language gate checked against each event before a run starts; non-matching events are skipped, so keep it to one sentence. To remove the gate, omit this field from the trigger; null is rejected.
                ack_reaction:
                  type: string
                  allOf:
                  - allOf:
                    - minLength: 1
                    - maxLength: 64
                    description: Emoji name to react with on a top-level triggering message when this trigger matches, e.g. `eyes`. Replies and an absent value post no reaction.
              required:
              - type
              - event
              additionalProperties: false
            - type: object
              properties:
                type:
                  type: string
                  enum:
                  - sentry
                event:
                  type: string
                  enum:
                  - issue_lifecycle
                  - any_issue
                  - event_alert
                  description: The Sentry event that starts a run.
                conditions:
                  type: object
                  properties:
                    projects:
                      type: array
                      items:
                        type: string
                      description: Sentry project slugs or ids to match.
                    levels:
                      type: array
                      items:
                        type: string
                      description: Issue levels to match, e.g. error, warning.
                    actions:
                      type: array
                      items:
                        type: string
                      description: Raw event action names to match.
                  additionalProperties: false
                  description: Filters that narrow which Sentry events start a run. A condition matches when the event matches any of its listed values.
                run_when:
                  type: string
                  minLength: 1
                  description: Natural-language gate checked against each event before a run starts; non-matching events are skipped, so keep it to one sentence. To remove the gate, omit this field from the trigger; null is rejected.
              required:
              - type
              - event
              additionalProperties: false
            - type: object
              properties:
                type:
                  type: string
                  enum:
                  - linear
                event:
                  type: string
                  enum:
                  - issue_created
                  - status_changed
                  - end_cycle
                  description: The Linear event that starts a run.
                conditions:
                  type: object
                  properties:
                    workspaces:
                      type: array
                      items:
                        type: string
                      description: Linear workspace ids to match.
                    teams:
                      type: array
                      items:
                        type: string
                      description: Linear team ids or keys to match.
                    projects:
                      type: array
                      items:
                        type: string
                      description: Linear project ids to match.
                    statuses:
                      type: array
                      items:
                        type: string
                      description: Issue statuses to match after the change.
                    from_statuses:
                      type: array
                      items:
                        type: string
                      description: Issue statuses to match before the change.
                    status_transitions:
                      type: array
                      items:
                        type: string
                      description: Status transitions to match, e.g. Todo->In Progress.
                    priorities:
                      type: array
                      items:
                        type: string
                      description: Issue priorities to match.
                    actors:
                      type: array
                      items:
                        type: string
                      description: Linear user ids of the actor that fired the event.
                    labels:
                      type: array
                      items:
                        type: string
                      description: Match when any of these labels is present.
                    assignees:
                      type: array
                      items:
                        type: string
                      description: Linear user ids of the assignee to match.
                    cycles:
                      type: array
                      items:
                        type: string
                      description: Linear cycle ids to match.
                  additionalProperties: false
                  description: Filters that narrow which Linear events start a run. A condition matches when the event matches any of its listed values.
                run_when:
                  type: string
                  minLength: 1
                  description: Natural-language gate checked against each event before a run starts; non-matching events are skipped, so keep it to one sentence. To remove the gate, omit this field from the trigger; null is rejected.
              required:
              - type
              - event
              additionalProperties: false
            - type: object
              properties:
                type:
                  type: string
                  enum:
                  - incoming_webhook
                coalescing:
                  $ref: '#/components/schemas/WebhookCoalescing'
                conditions:
                  type: object
                  properties:
                    contains:
                      type: array
                      items:
                        type: string
                      description: Run only when the request body contains one of these substrings.
                    excludes:
                      type: array
                      items:
                        type: string
                      description: Skip when the request body contains one of these substrings.
                    regex:
                      type: string
                      description: Run only when the request body matches this regular expression.
                  additionalProperties: false
                  description: Filters that narrow which incoming requests start a run. A condition matches when the request matches any of its listed values.
                run_when:
                  type: string
                  minLength: 1
                  description: Natural-language gate checked against each event before a run starts; non-matching events are skipped, so keep it to one sentence. To remove the gate, omit this field from the trigger; null is rejected.
              required:
              - type
              additionalProperties: false
            - type: object
              properties:
                type:
                  type: string
                  enum:
                  - on_demand
              required:
              - type
              additionalProperties: false
        model:
          anyOf:
          - $ref: '#/components/schemas/ModelSelection'
          - type: 'null'
          description: The pinned model, or null when the automation is unpinned and each run resolves the run-as principal's default model at run creation.
        repos:
          type: array
          items:
            type: object
            properties:
              repo:
                type: string
              branch:
                type: string
            required:
            - repo
            - branch
            additionalProperties: false
        threadMode:
          type: string
          enum:
          - new
          - single
        slackImpersonation:
          type: boolean
        singleJamId:
          anyOf:
          - type: string
          - type: 'null'
        mcpOverrides:
          anyOf:
          - type: object
            properties:
              enabled_server_keys:
                type: array
                items:
                  type: string
