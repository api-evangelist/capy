openapi: 3.2.0
info:
  title: Capy Projects API
  version: 1.0.0
  description: Programmatic access to Capy's agent platform.
servers:
- url: https://api.capy.ai
security:
- bearerAuth: []
tags:
- name: Projects
paths:
  /api/v1/projects:
    get:
      tags:
      - Projects
      operationId: projects.list
      parameters: []
      security:
      - bearerAuth: []
      responses:
        '200':
          description: ProjectList
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectListEncoded'
        '401':
          description: capy/Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/capy_UnauthorizedEncoded'
        '403':
          description: capy/Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/capy_ForbiddenEncoded'
        '429':
          description: capy/RateLimited
          headers:
            retry-after:
              schema:
                type: integer
              required: true
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/capy_RateLimitedEncoded'
      summary: List projects
  /api/v1/projects/{projectId}:
    get:
      tags:
      - Projects
      operationId: projects.get
      parameters:
      - name: projectId
        in: path
        schema:
          type: string
        required: true
      security:
      - bearerAuth: []
      responses:
        '200':
          description: Project
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectEncoded'
        '401':
          description: capy/Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/capy_UnauthorizedEncoded'
        '403':
          description: capy/Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/capy_ForbiddenEncoded'
        '404':
          description: capy/ProjectNotFound
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/capy_ProjectNotFoundEncoded'
        '429':
          description: capy/RateLimited
          headers:
            retry-after:
              schema:
                type: integer
              required: true
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/capy_RateLimitedEncoded'
      summary: Get project
  /api/v1/projects/{projectId}/environment-variables:
    get:
      tags:
      - Projects
      operationId: projects.listEnvironmentVariables
      parameters:
      - name: projectId
        in: path
        schema:
          type: string
        required: true
      security:
      - bearerAuth: []
      responses:
        '200':
          description: EnvironmentVariableList
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EnvironmentVariableListEncoded'
        '401':
          description: capy/Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/capy_UnauthorizedEncoded'
        '403':
          description: capy/Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/capy_ForbiddenEncoded'
        '404':
          description: capy/ProjectNotFound
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/capy_ProjectNotFoundEncoded'
        '429':
          description: capy/RateLimited
          headers:
            retry-after:
              schema:
                type: integer
              required: true
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/capy_RateLimitedEncoded'
      summary: List environment variables
    put:
      tags:
      - Projects
      operationId: projects.setEnvironmentVariables
      parameters:
      - name: projectId
        in: path
        schema:
          type: string
        required: true
      security:
      - bearerAuth: []
      responses:
        '200':
          description: EnvironmentVariableList
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EnvironmentVariableListEncoded'
        '400':
          description: capy/InvalidRequest
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/capy_InvalidRequestEncoded'
        '401':
          description: capy/Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/capy_UnauthorizedEncoded'
        '403':
          description: capy/Forbidden
          content:
            application/json:
              schema:
                anyOf:
                - $ref: '#/components/schemas/capy_ForbiddenEncoded'
                - $ref: '#/components/schemas/capy_ForbiddenEncoded'
        '404':
          description: capy/ProjectNotFound
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/capy_ProjectNotFoundEncoded'
        '429':
          description: capy/RateLimited
          headers:
            retry-after:
              schema:
                type: integer
              required: true
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/capy_RateLimitedEncoded'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SetEnvironmentVariablesRequest'
        required: true
      summary: Set environment variables
    delete:
      tags:
      - Projects
      operationId: projects.deleteEnvironmentVariables
      parameters:
      - name: projectId
        in: path
        schema:
          type: string
        required: true
      security:
      - bearerAuth: []
      responses:
        '200':
          description: EnvironmentVariableList
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EnvironmentVariableListEncoded'
        '401':
          description: capy/Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/capy_UnauthorizedEncoded'
        '403':
          description: capy/Forbidden
          content:
            application/json:
              schema:
                anyOf:
                - $ref: '#/components/schemas/capy_ForbiddenEncoded'
                - $ref: '#/components/schemas/capy_ForbiddenEncoded'
        '404':
          description: capy/ProjectNotFound
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/capy_ProjectNotFoundEncoded'
        '429':
          description: capy/RateLimited
          headers:
            retry-after:
              schema:
                type: integer
              required: true
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/capy_RateLimitedEncoded'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DeleteEnvironmentVariablesRequest'
        required: true
      summary: Delete environment variables
components:
  schemas:
    capy_ProjectNotFoundEncoded:
      type: object
      properties:
        _tag:
          type: string
          enum:
          - capy/ProjectNotFound
        projectId:
          type: string
      required:
      - _tag
      - projectId
      additionalProperties: false
    ProjectListEncoded:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/ProjectEncoded'
      required:
      - items
      additionalProperties: false
    EnvironmentVariableEncoded:
      type: object
      properties:
        name:
          type: string
        description:
          anyOf:
          - type: string
          - type: 'null'
        updatedAt:
          type: string
      required:
      - name
      - description
      - updatedAt
      additionalProperties: false
    capy_RateLimitedEncoded:
      type: object
      properties:
        _tag:
          type: string
          enum:
          - capy/RateLimited
        retryAfterSeconds:
          type: integer
      required:
      - _tag
      - retryAfterSeconds
      additionalProperties: false
    EnvironmentVariableListEncoded:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/EnvironmentVariableEncoded'
      required:
      - items
      additionalProperties: false
    ProjectRepoEncoded:
      type: object
      properties:
        repoFullName:
          type: string
        baseBranch:
          type: string
        mode:
          type: string
          enum:
          - primary
          - lazy
      required:
      - repoFullName
      - baseBranch
      - mode
      additionalProperties: false
    DeleteEnvironmentVariablesRequest:
      type: object
      properties:
        names:
          type: array
          items:
            type: string
            pattern: ^[A-Za-z_][A-Za-z0-9_]*$
          minItems: 1
          maxItems: 500
      required:
      - names
      additionalProperties: false
    capy_UnauthorizedEncoded:
      type: object
      properties:
        _tag:
          type: string
          enum:
          - capy/Unauthorized
      required:
      - _tag
      additionalProperties: false
    capy_InvalidRequestEncoded:
      type: object
      properties:
        _tag:
          type: string
          enum:
          - capy/InvalidRequest
        message:
          type: string
      required:
      - _tag
      - message
      additionalProperties: false
    ProjectEncoded:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        description:
          anyOf:
          - type: string
          - type: 'null'
        code:
          type: string
          allOf:
          - minLength: 1
          - maxLength: 255
        visibility:
          type: string
          enum:
          - org
          - private
        repos:
          type: array
          items:
            $ref: '#/components/schemas/ProjectRepoEncoded'
        createdAt:
          type: string
        updatedAt:
          type: string
      required:
      - id
      - name
      - description
      - code
      - visibility
      - repos
      - createdAt
      - updatedAt
      additionalProperties: false
    capy_ForbiddenEncoded:
      type: object
      properties:
        _tag:
          type: string
          enum:
          - capy/Forbidden
      required:
      - _tag
      additionalProperties: false
    SetEnvironmentVariablesRequest:
      type: object
      properties:
        entries:
          type: array
          items:
            type: object
            properties:
              name:
                type: string
                pattern: ^[A-Za-z_][A-Za-z0-9_]*$
              value:
                type: string
              description:
                type: string
            required:
            - name
            - value
            additionalProperties: false
          minItems: 1
          maxItems: 500
      required:
      - entries
      additionalProperties: false
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: Capy API key
      description: An API key created in Capy under Settings → API.
x-provenance:
  method: harvested
  publisher: Capy
  source: https://docs.capy.ai/openapi.json
  note: split by refine-openapis from the provider's own published document, verified by fetch (openapi/_original/*.fetch.json);
    stamped by stamp-openapi-provenance.py (roadmap#793)
